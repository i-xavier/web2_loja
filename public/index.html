<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Web2 Loja</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    form,
    .busca-box {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    input,
    button {
      padding: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 0.6rem;
      text-align: left;
    }

    th {
      background-color: #f4f4f4;
    }
  </style>
</head>

<body>
  <h1>Cadastro de Produtos</h1>

  <form id="form-produto">
    <input type="text" name="nome" placeholder="Nome do produto" required>
    <input type="number" name="preco" step="0.01" placeholder="Preço" required>
    <input type="number" name="estoque" placeholder="Estoque" value="0">
    <button type="submit">Salvar Produto</button>
  </form>

  <h2>Produtos</h2>

  <div class="busca-box">
    <input type="text" id="campo-busca" placeholder="Buscar produto por nome...">
    <button type="button" id="btn-buscar">Buscar</button>
    <button type="button" id="btn-limpar">Limpar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-produtos"></tbody>
  </table>

  <hr>

  <h2>Categorias</h2>

  <form id="form-categoria">
    <input type="text" name="nome" placeholder="Nova categoria" required>
    <button type="submit">Salvar Categoria</button>
  </form>

  <ul id="lista-categorias"></ul>

  <script>
    const formProduto = document.getElementById('form-produto');
    const tbodyProdutos = document.getElementById('tabela-produtos');
    const campoBusca = document.getElementById('campo-busca');
    const btnBuscar = document.getElementById('btn-buscar');
    const btnLimpar = document.getElementById('btn-limpar');

    const formCategoria = document.getElementById('form-categoria');
    const listaCategorias = document.getElementById('lista-categorias');

    async function carregarProdutos(busca = '') {
      const url = busca
        ? `/produtos?busca=${encodeURIComponent(busca)}`
        : '/produtos';

      const resp = await fetch(url);
      const produtos = await resp.json();
      tbodyProdutos.innerHTML = '';

      for (const p of produtos) {
        const tr = document.createElement('tr');

        const tdId = document.createElement('td');
        tdId.textContent = p.id;

        const tdNome = document.createElement('td');
        tdNome.textContent = p.nome;

        const tdPreco = document.createElement('td');
        tdPreco.textContent = Number(p.preco).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });

        const tdEstoque = document.createElement('td');
        tdEstoque.textContent = p.estoque;

        const tdAcoes = document.createElement('td');
        const btnExcluir = document.createElement('button');
        btnExcluir.textContent = 'Excluir';
        btnExcluir.addEventListener('click', async () => {
          await fetch(`/produtos/${p.id}`, { method: 'DELETE' });
          carregarProdutos(campoBusca.value.trim());
        });
        tdAcoes.append(btnExcluir);

        tr.append(tdId, tdNome, tdPreco, tdEstoque, tdAcoes);
        tbodyProdutos.append(tr);
      }
    }

    formProduto.addEventListener('submit', async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(formProduto));
      await fetch('/produtos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d)
      });
      formProduto.reset();
      carregarProdutos();
    });

    btnBuscar.addEventListener('click', () => {
      carregarProdutos(campoBusca.value.trim());
    });

    btnLimpar.addEventListener('click', () => {
      campoBusca.value = '';
      carregarProdutos();
    });

    async function carregarCategorias() {
      const resp = await fetch('/categorias');
      const categorias = await resp.json();
      listaCategorias.innerHTML = '';

      for (const c of categorias) {
        const li = document.createElement('li');
        li.textContent = `${c.id} - ${c.nome}`;
        listaCategorias.append(li);
      }
    }

    formCategoria.addEventListener('submit', async (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(formCategoria));
      await fetch('/categorias', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d)
      });
      formCategoria.reset();
      carregarCategorias();
    });

    carregarProdutos();
    carregarCategorias();
  </script>
</body>

</html>
